import = [
"~/.config/alacritty/themes/themes/catppuccin.toml"
]

[ env ]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10
dimensions = {columns = 100, lines = 50}
# MacOS only: Title bar, transparent background and no title bar buttons
decorations = "Buttonless"

[font]
normal.family = "JetBrainsMono Nerd Font"
#regular
size = 16

